<div class="wlt-c-furg-content-header">
  <div class="container-fluid">
    <div class="row mb-2">
      <div class="col-12 col-sm-12 col-md-4 col-lg-4">
        <h1 class="mb-1">Agreements</h1>
      </div>
      <div class="col-12 col-sm-12 col-md-8 col-lg-8 my-1">
        <ol class="breadcrumb float-md-right">
           <li class="breadcrumb-item"><a routerLink="/dashboard">Quotation & Agreement</a></li>
          <li class="breadcrumb-item active">Agreements</li>
        </ol>
      </div>
    </div>
  </div>
</div>
<mat-card>
  <mat-card-content>
    <div class="row" *ngIf="warningMessage ===''">
      <div class="col-12 col-sm-12 col-md-4 col-lg-4 order-2 order-md-1">
        <div class="text-right">
          <mat-form-field appearance="outline">
            <mat-label>Search</mat-label>
            <input matInput (keyup)="applyFilter($event)" placeholder="" #input>
          </mat-form-field>
          <mat-form-field appearance="outline">
            <mat-label>Branch</mat-label>
            <mat-select (selectionChange)="changeBranch($event.value)">
              <mat-option *ngFor="let d of branchList" value="{{d.Code}}">{{d.Code}}</mat-option>
            </mat-select>
          </mat-form-field>
        </div>
      </div>
      <div class="col-12 col-sm-12 col-md-8 col-lg-8 order-1 order-md-2" >
        <div class="text-right pt-2">
          <button *ngIf="this.userAccessModel.createAccess == true || currentUser == 'superadmin'" class="btn wlt-c-furg-btn-primary"
                  [routerLink]="['/quotation-and-agreement/agreements/new-agreement']">
            <mat-icon>add</mat-icon>
            <span>New</span></button>
        </div>
      </div>
    </div>
    <div class="table-responsive" *ngIf="errorMessage =='' && warningMessage ===''">
      <table mat-table [dataSource]="dataSource" class="wlt-table table-striped" matSort
             (matSortChange)="announceSortChange($event)">
        <!--                <ng-container matColumnDef="ID">-->
        <!--                    <th mat-header-cell *matHeaderCellDef mat-sort-header> S.No. </th>-->
        <!--                    <td mat-cell *matCellDef="let element" class="text-left"> {{element.ID}} </td>-->
        <!--                </ng-container>-->
        <ng-container matColumnDef="BranchName">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Branch Name</th>
          <td mat-cell *matCellDef="let element" class="text-left"> {{element.BranchName}} </td>
        </ng-container>
        <ng-container matColumnDef="ClientName">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Client Name</th>
          <td mat-cell *matCellDef="let element" class="text-left"> {{element.ClientName}} </td>
        </ng-container>
        <ng-container matColumnDef="WorkPlace">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Work Place</th>
          <td mat-cell *matCellDef="let element" class="text-left"> {{element.WorkPlace}} </td>
        </ng-container>
        <ng-container matColumnDef="AgreementDate">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Start</th>
          <td mat-cell *matCellDef="let element" class="text-left"> {{returnDate(element.AgreementDate)}} </td>
        </ng-container>
        <ng-container matColumnDef="action" stickyEnd>
          <th mat-header-cell *matHeaderCellDef style="text-align:center; width: 120px;">
            Action
          </th>
          <td mat-cell *matCellDef="let row" style="text-align:center;">
            <a *ngIf="this.userAccessModel.updateAccess == true || currentUser == 'superadmin'" style="cursor:pointer;" class="wlt-c-furg-text-primary mr-2" matTooltip="Edit" [routerLink]="['/quotation-and-agreement/agreements/edit-agreement',row.ID]">
              <mat-icon
                aria-hidden="false" aria-label="edit icon">edit
              </mat-icon>
            </a>
            <!-- <a style="cursor:pointer;" class="wlt-c-furg-text-success mr-2" matTooltip="View"><mat-icon aria-hidden="false" aria-label="view icon">visibility</mat-icon></a> -->
            <a *ngIf="this.userAccessModel.deleteAccess == true || currentUser == 'superadmin'" style="cursor:pointer;" class="wlt-c-furg-text-danger" matTooltip="Delete"
           (click)="deleteRow(row)">
              <mat-icon
                    aria-hidden="false" aria-label="trash icon">delete_outline</mat-icon></a>
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </div>
    <div *ngIf="warningMessage !==''">
      <mat-label style="color:red" [innerHTML]="warningMessage"></mat-label>   
     </div>
     <div *ngIf="errorMessage !==''">
      <mat-label style="color:red" [innerHTML]="errorMessage"></mat-label>   
     </div>
    <mat-paginator [pageSizeOptions]="pageSizeOptions" showFirstLastButtons
                   aria-label="Select page of periodic elements">
    </mat-paginator>
  </mat-card-content>
</mat-card>

<!-- model pop up for logic started -->
<div [style.display]="showLoadingSpinner ? 'block' : 'none'"
  style="margin-top: -20.5rem; display: block; margin-left: -6.5rem;">
  <div class="d-flex justify-content-center">
    <span class="loader"></span>
  </div>
</div>
<!-- model pop up for logic ended -->
