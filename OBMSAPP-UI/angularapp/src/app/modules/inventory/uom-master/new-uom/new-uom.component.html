<div class="wlt-c-furg-content-header">
    <div class="container-fluid">
        <div class="row mb-2">
            <div class="col-12 col-sm-12 col-md-4 col-lg-4">
                <h1 class="mb-1">{{isEdit ? 'Edit' : 'Add'}} UOM</h1>
            </div>
            <div class="col-12 col-sm-12 col-md-8 col-lg-8 my-1">
                <ol class="breadcrumb float-md-right">
                    <li class="breadcrumb-item"><a routerLink="/dashboard">Inventory</a></li>
                    <li class="breadcrumb-item"><a routerLink="/inventory/uom-master">UOM Master List</a></li>
                    <li class="breadcrumb-item active">{{isEdit ? 'Update' : 'New'}} UOM</li>
                </ol>
            </div>
        </div>
    </div>
</div>

<mat-card>
    <mat-card-content>
        <form [formGroup]="frm" (ngSubmit)="onSubmit()">
            <div class="row">
                <div class="col-12 col-sm-12 col-md-4 col-lg-4">
                    <mat-form-field appearance="outline">
                        <mat-label>Code</mat-label>
                        <input type="text" formControlName="Code" matInput placeholder="" autocomplete="off">
                    </mat-form-field>
                </div>
                <div class="col-12 col-sm-12 col-md-4 col-lg-4">
                    <mat-form-field appearance="outline">
                        <mat-label>Name</mat-label>
                        <input type="text" formControlName="Name" matInput placeholder="" autocomplete="off">
                    </mat-form-field>
                </div>
                <div class="col-12 col-sm-12 col-md-4 col-lg-4">
                    <mat-form-field appearance="outline">
                        <mat-label>Short Name</mat-label>
                        <input type="text" formControlName="ShortName" matInput placeholder="" autocomplete="off">
                    </mat-form-field>
                </div>
                <div class="col-12 col-sm-12 col-md-4 col-lg-4">
                    <mat-checkbox formControlName="IsPrimary">Is Primary</mat-checkbox>
                </div>
            </div>
            <div class="row">
                <div class="col-12">
                    <div class="text-right">
                        <button class="btn wlt-c-furg-btn-gray mr-3" (click)="onCancelClick()" mat-dialog-close> Cancel</button>
                        <button *ngIf="this.userAccessModel.createAccess == true || this.userAccessModel.updateAccess == true || currentUser == 'superadmin'"
                        class="btn wlt-c-furg-btn-primary">  {{isEdit ? 'Update' : 'Save'}}</button>
                    </div>
                </div>
            </div>
        </form>
    </mat-card-content>
</mat-card>

<!-- model pop up for logic started -->
<div [style.display]="showLoadingSpinner ? 'block' : 'none'"
  style="margin-top: -20.5rem; display: block; margin-left: -6.5rem;">
  <div class="d-flex justify-content-center">
    <span class="loader"></span>
  </div>
</div>
<!-- model pop up for logic ended -->
