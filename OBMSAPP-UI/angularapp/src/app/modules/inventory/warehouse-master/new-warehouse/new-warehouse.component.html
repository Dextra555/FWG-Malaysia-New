<div class="wlt-c-furg-content-header">
  <div class="container-fluid">
    <div class="row mb-2">
      <div class="col-12 col-sm-12 col-md-4 col-lg-4">
        <h1 class="mb-1">{{isEdit ? 'Edit' : 'Add'}} Warehouse</h1>
      </div>
      <div class="col-12 col-sm-12 col-md-8 col-lg-8 my-1">
        <ol class="breadcrumb float-md-right">
          <li class="breadcrumb-item"><a routerLink="/dashboard">Inventory</a></li>
          <li class="breadcrumb-item"><a routerLink="/inventory/warehouse-master">Warehouse Master List</a></li>
          <li class="breadcrumb-item active">{{isEdit ? 'Update' : 'New'}} Warehouse</li>
        </ol>
      </div>
    </div>
  </div>
</div>

<mat-card>
  <mat-card-content>
    <form [formGroup]="frm" (ngSubmit)="onSubmit()">
      <div class="row">
        <div class="col-12 col-sm-12 col-md-4 col-lg-4">
          <mat-form-field appearance="outline">
            <mat-label>Warehouse Code</mat-label>
            <input type="text" formControlName="Code" matInput placeholder="" autocomplete="off">
          </mat-form-field>
        </div>
        <div class="col-12 col-sm-12 col-md-4 col-lg-4">
          <mat-form-field appearance="outline">
            <mat-label>Warehouse Name</mat-label>
            <input type="text" formControlName="Name" matInput placeholder="" autocomplete="off">
          </mat-form-field>
        </div>
        <div class="col-12 col-sm-12 col-md-4 col-lg-4">
          <mat-form-field appearance="outline">
            <mat-label>Branch</mat-label>
            <mat-select formControlName="BranchID" (openedChange)="onBranchOpen($event)">
              <mat-option disabled style="position:sticky;top:0;background:#fff;z-index:1;padding:0">
                <div style="padding:4px 10px">
                  <input type="text" placeholder="Search branch…" [value]="branchSearch"
                    (input)="onBranchSearch($any($event.target).value)"
                    (click)="$event.stopPropagation()" (keydown)="$event.stopPropagation()"
                    style="width:100%;border:1px solid #ccc;border-radius:4px;padding:6px 8px;font-size:13px;outline:none">
                </div>
              </mat-option>
              <mat-option [value]="0">-- Select Branch --</mat-option>
              <mat-option *ngFor="let b of filteredBranches" [value]="b.ID">{{b.Name}}</mat-option>
              <mat-option disabled *ngIf="filteredBranches.length === 0 && branchSearch.length > 0">No results found.</mat-option>
            </mat-select>
          </mat-form-field>
        </div>
        <div class="col-12 col-sm-12 col-md-4 col-lg-4">
          <mat-form-field appearance="outline">
            <mat-label>Address</mat-label>
            <textarea formControlName="Address" matInput placeholder=""></textarea>
          </mat-form-field>
        </div>
        <div class="col-12 col-sm-12 col-md-4 col-lg-4">
          <mat-checkbox formControlName="IsActive">Is Active</mat-checkbox>
        </div>
      </div>
      <div class="row" *ngIf="warningMessage !== ''">
        <div class="col-12">
          <mat-label style="color:red" [innerHTML]="warningMessage"></mat-label>
        </div>
      </div>
      <div class="row" *ngIf="errorMessage !== ''">
        <div class="col-12">
          <mat-label style="color:red" [innerHTML]="errorMessage"></mat-label>
        </div>
      </div>
      <div class="row">
        <div class="col-12">
          <div class="text-right">
            <button class="btn wlt-c-furg-btn-gray mr-3" (click)="onCancelClick()"> Cancel</button>
            <button *ngIf="this.userAccessModel.createAccess == true || this.userAccessModel.updateAccess == true || currentUser == 'superadmin'"
            class="btn wlt-c-furg-btn-primary">  {{isEdit ? 'Update' : 'Save'}}</button>
          </div>
        </div>
      </div>
    </form>
  </mat-card-content>
</mat-card>

<!-- model pop up for logic started -->
<div [style.display]="showLoadingSpinner ? 'block' : 'none'"
  style="margin-top: -20.5rem; display: block; margin-left: -6.5rem;">
  <div class="d-flex justify-content-center">
    <span class="loader"></span>
  </div>
</div>
<!-- model pop up for logic ended -->
