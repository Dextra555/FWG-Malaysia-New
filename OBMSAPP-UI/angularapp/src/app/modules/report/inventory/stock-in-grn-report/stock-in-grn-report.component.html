<div class="wlt-c-furg-content-header">
  <div class="container-fluid">
    <div class="row mb-2">
      <div class="col-12 col-sm-12 col-md-4 col-lg-4">
        <h1 class="mb-1">Report / Stock In (GRN)</h1>
      </div>
      <div class="col-12 col-sm-12 col-md-8 col-lg-8 my-1">
        <ol class="breadcrumb float-md-right">
          <li class="breadcrumb-item"><a routerLink="/dashboard">Report</a></li>
          <li class="breadcrumb-item active">Stock In (GRN)</li>
        </ol>
      </div>
    </div>
  </div>
</div>

<mat-card class="report-card">
  <mat-card-content>

    <!-- Access denied -->
    <div *ngIf="warningMessage !== ''" class="mt-2">
      <mat-label style="color:red" [innerHTML]="warningMessage"></mat-label>
    </div>

    <form [formGroup]="frm" (ngSubmit)="onSubmit()" *ngIf="warningMessage === ''">

      <!-- Row 1: Filters -->
      <div class="row">

        <!-- Warehouse (optional) -->
        <div class="col-12 col-sm-6 col-md-2 col-lg-2">
          <mat-form-field appearance="outline">
            <mat-label>Warehouse</mat-label>
            <mat-select formControlName="WarehouseID">
              <mat-option value="0">All Warehouses</mat-option>
              <mat-option *ngFor="let w of warehouseList" [value]="w.ID">{{ w.Name }}</mat-option>
            </mat-select>
          </mat-form-field>
        </div>

        <!-- Supplier (optional) -->
        <div class="col-12 col-sm-6 col-md-3 col-lg-3">
          <mat-form-field appearance="outline">
            <mat-label>Supplier</mat-label>
            <mat-select formControlName="SupplierID">
              <mat-option value="0">All Suppliers</mat-option>
              <mat-option *ngFor="let s of supplierList" [value]="s.Id">{{ s.Name }}</mat-option>
            </mat-select>
          </mat-form-field>
        </div>

        <!-- Item (optional) -->
        <div class="col-12 col-sm-6 col-md-2 col-lg-2">
          <mat-form-field appearance="outline">
            <mat-label>Item</mat-label>
            <mat-select formControlName="ItemID">
              <mat-option value="0">All Items</mat-option>
              <mat-option *ngFor="let d of itemList" [value]="d.ID">{{ d.Name }}</mat-option>
            </mat-select>
          </mat-form-field>
        </div>

        <!-- Start Date (required) -->
        <div class="col-12 col-sm-6 col-md-2 col-lg-2">
          <mat-form-field appearance="outline">
            <mat-label>Start Date <span style="color:red">*</span></mat-label>
            <input matInput formControlName="StartDate"
                   [matDatepicker]="picker1" autocomplete="off">
            <mat-datepicker-toggle matSuffix [for]="picker1"></mat-datepicker-toggle>
            <mat-datepicker #picker1></mat-datepicker>
            <mat-error *ngIf="frm.get('StartDate')?.hasError('required')">Required.</mat-error>
          </mat-form-field>
        </div>

        <!-- End Date (required) -->
        <div class="col-12 col-sm-6 col-md-2 col-lg-2">
          <mat-form-field appearance="outline">
            <mat-label>End Date <span style="color:red">*</span></mat-label>
            <input matInput formControlName="EndDate"
                   [matDatepicker]="picker2" autocomplete="off">
            <mat-datepicker-toggle matSuffix [for]="picker2"></mat-datepicker-toggle>
            <mat-datepicker #picker2></mat-datepicker>
            <mat-error *ngIf="frm.get('EndDate')?.hasError('required')">Required.</mat-error>
          </mat-form-field>
        </div>

      </div>

      <!-- Row 2: Buttons (own row — no cut-off) -->
      <div class="row mt-1">
        <div class="col-12 text-right">
          <button type="button" class="btn btn-outline-secondary mr-2" (click)="onClear()">
            Clear
          </button>
          <button type="submit" class="btn wlt-c-furg-btn-primary mr-2">
            Search
          </button>
          <button type="button" class="btn btn-success" (click)="onExportExcel()"
                  [disabled]="frm.invalid">
            <mat-icon style="vertical-align:middle; font-size:18px; margin-right:4px">table_view</mat-icon>
            Export Excel
          </button>
        </div>
      </div>

      <!-- Error message -->
      <div class="row" *ngIf="errorMessage !== ''">
        <div class="col-12">
          <mat-label style="color:red">{{ errorMessage }}</mat-label>
        </div>
      </div>

    </form>

    <br />

    <!-- PDF rendered inline in iframe -->
    <iframe class="report-wrapper fixed-height"
            *ngIf="warningMessage === '' && urlSafe"
            [src]="urlSafe">
    </iframe>

  </mat-card-content>
</mat-card>

<!-- Loading spinner -->
<div [style.display]="showLoadingSpinner ? 'block' : 'none'"
     style="margin-top:-10.5rem; display:block; margin-left:-6.5rem;">
  <div class="d-flex justify-content-center">
    <span class="loader"></span>
  </div>
</div>
