<div class="wlt-c-furg-content-header">
  <div class="container-fluid">
    <div class="row mb-2">
      <div class="col-12 col-sm-12 col-md-4 col-lg-4">
        <h1 class="mb-1">Report/Employee Report</h1>
      </div>
      <div class="col-12 col-sm-12 col-md-8 col-lg-8 my-1">
        <ol class="breadcrumb float-md-right">
          <li class="breadcrumb-item"><a routerLink="/dashboard">Master</a></li>
          <li class="breadcrumb-item active">Employee Report</li>
        </ol>
      </div>
    </div>
  </div>
</div>

<mat-card class="report-card full-width-report">
  <mat-card-content>

    <form [formGroup]="frm" (ngSubmit)="onSubmit()" >
      <div class="row ml-1 mt-2" *ngIf="warningMessage ===''">
        <div class="col-12 col-sm-12 col-md-4 col-lg-2">
          <mat-label class="mr-3"><strong>Type</strong></mat-label>
          <br />
          <mat-radio-group aria-label="Select a Type" formControlName="type">
            <mat-radio-button value="Guard">Guard</mat-radio-button>
            <mat-radio-button value="Staff">Staff</mat-radio-button>
                        <mat-radio-button value="Others">Other Guards</mat-radio-button>
          </mat-radio-group>
        </div>
        <div class="col-12 col-sm-12 col-md-4 col-lg-4">
          <mat-form-field appearance="outline">
            <mat-label>Branch</mat-label>
            <mat-select formControlName="branch" [panelClass]="'custom-dropdown-panel'"
              (keydown)="onKeyDropdown($event, 'branchSearchString', 'branchList', 'filteredBranchList', 'Code', branchSearchSubject)">
              <mat-option *ngFor="let d of branchList" value="{{d.Code}}">{{d.Code}}</mat-option>
            </mat-select>
          </mat-form-field>
        </div>
        <div class="col-12 col-sm-12 col-md-4 col-lg-2">
          <mat-form-field appearance="outline">
            <mat-label>CSG/TNG</mat-label>
            <mat-select formControlName="csgtngStatus">
              <mat-option value="All">All</mat-option>
              <mat-option value="With">Attend</mat-option>
              <mat-option value="Without">Not Attend</mat-option>
            </mat-select>
          </mat-form-field>
        </div>
        <div class="col-12 col-sm-12 col-md-4 col-lg-4">
          <button class="btn wlt-c-furg-btn-primary"> Search </button>
        </div>
      </div>
    </form>
    <br />
    <div *ngIf="warningMessage !==''">
      <mat-label style="color:red" [innerHTML]="warningMessage"></mat-label>
    </div>
    <div *ngIf="errorMessage !==''">
      <mat-label style="color:red" [innerHTML]="errorMessage"></mat-label>
    </div>
    <iframe *ngIf="urlSafe" (load)="onReportLoad()" class="report-wrapper fixed-height" [src]="urlSafe"></iframe>
  </mat-card-content>
</mat-card>

<!-- model pop up for logic started -->
<div [style.display]="showLoadingSpinner ? 'block' : 'none'"
  style="margin-top: -10.5rem; display: block; margin-left: -6.5rem;">
  <div class="d-flex justify-content-center">
    <span class="loader"></span>
  </div>
</div>
<!-- model pop up for logic ended -->
