<div class="wlt-c-furg-content-header">
  <div class="container-fluid">
    <div class="row mb-2">
      <div class="col-12 col-sm-12 col-md-6 col-lg-6">
        <h1 class="mb-1">Report / Employee Visa &amp; Passport Expiry Reminder</h1>
      </div>
      <div class="col-12 col-sm-12 col-md-6 col-lg-6 my-1">
        <ol class="breadcrumb float-md-right">
          <li class="breadcrumb-item"><a routerLink="/dashboard">Master</a></li>
          <li class="breadcrumb-item active">Expiry Reminder</li>
        </ol>
      </div>
    </div>
  </div>
</div>

<mat-card class="report-card full-width-report">
  <mat-card-content>

    <!-- Warning -->
    <div *ngIf="warningMessage !== ''">
      <mat-label style="color:red" [innerHTML]="warningMessage"></mat-label>
    </div>

    <!-- Two toggle buttons -->
    <div *ngIf="warningMessage === ''" class="mb-3 mt-1 ml-1">
      <button
        class="btn mr-3"
        [ngClass]="activeType === 'Visa' ? 'wlt-c-furg-btn-primary' : 'wlt-c-furg-btn-gray'"
        (click)="loadReport('Visa')">
        <mat-icon style="font-size:18px; vertical-align:middle; margin-right:4px;">credit_card</mat-icon>
        Visa Expiry (4 Months)
      </button>

      <button
        class="btn"
        [ngClass]="activeType === 'Passport' ? 'wlt-c-furg-btn-primary' : 'wlt-c-furg-btn-gray'"
        (click)="loadReport('Passport')">
        <mat-icon style="font-size:18px; vertical-align:middle; margin-right:4px;">badge</mat-icon>
        Passport Expiry (18 Months)
      </button>
    </div>

    <!-- Crystal Report iframe -->
    <iframe *ngIf="urlSafe"
      (load)="onReportLoad()"
      class="report-wrapper fixed-height"
      [src]="urlSafe">
    </iframe>

  </mat-card-content>
</mat-card>

<!-- Loading spinner -->
<div [style.display]="showLoadingSpinner ? 'block' : 'none'"
  style="margin-top: -10.5rem; display: block; margin-left: -6.5rem;">
  <div class="d-flex justify-content-center">
    <span class="loader"></span>
  </div>
</div>
