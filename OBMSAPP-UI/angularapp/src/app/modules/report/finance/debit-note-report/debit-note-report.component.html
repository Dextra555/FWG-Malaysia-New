<div class="wlt-c-furg-content-header">
  <div class="container-fluid">
    <div class="row mb-3">
      <div class="col-12 col-sm-12 col-md-8 col-lg-5">
        <h1 class="mb-1">Report / Finance / Debit Note</h1>
      </div>
      <div class="col-12 col-sm-12 col-md-8 col-lg-7 my-1">
        <ol class="breadcrumb float-md-right">
          <li class="breadcrumb-item"><a routerLink="/dashboard">Report</a></li>
          <li class="breadcrumb-item">Finance</li>
          <li class="breadcrumb-item active">Debit Note</li>
        </ol>
      </div>
    </div>
  </div>
</div>

<mat-card class="report-card">
  <mat-card-content>

    <form [formGroup]="frm" (ngSubmit)="onSubmit()">

      <div class="row" *ngIf="warningMessage === ''">
        <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">

          <label style="font-weight: bold; white-space: nowrap; margin: 0 5px 17px 13px;">Period:</label>

          <mat-form-field appearance="outline" style="max-width: 180px;">
            <mat-label>Start Date</mat-label>
            <input matInput [matDatepicker]="picker1" formControlName="StartDate" autocomplete="off">
            <mat-datepicker-toggle matSuffix [for]="picker1"></mat-datepicker-toggle>
            <mat-datepicker #picker1></mat-datepicker>
          </mat-form-field>

          <span style="margin: 0 5px 17px 0;">to</span>

          <mat-form-field appearance="outline" style="max-width: 180px;">
            <mat-label>End Date</mat-label>
            <input matInput [matDatepicker]="picker2" formControlName="EndDate" autocomplete="off">
            <mat-datepicker-toggle matSuffix [for]="picker2"></mat-datepicker-toggle>
            <mat-datepicker #picker2></mat-datepicker>
          </mat-form-field>

          <mat-form-field appearance="outline" style="max-width: 200px;">
            <mat-label>Branch</mat-label>
            <mat-select formControlName="Branch" (selectionChange)="onBranchChange($event.value)">
              <mat-option value="">All Branches</mat-option>
              <mat-option *ngFor="let b of branchList" [value]="b.Code">{{b.Code}}</mat-option>
            </mat-select>
          </mat-form-field>

          <mat-form-field appearance="outline" style="max-width: 220px;">
            <mat-label>Client</mat-label>
            <mat-select formControlName="Client">
              <mat-option value="">All Clients</mat-option>
              <mat-option *ngFor="let c of clientList" [value]="c.Code">{{c.Name}}</mat-option>
            </mat-select>
          </mat-form-field>

        </div>
      </div>

      <div class="row" *ngIf="warningMessage === ''">
        <div class="col-12 text-left" style="padding: 0 0 8px 13px;">
          <button type="submit" class="btn wlt-c-furg-btn-primary" [disabled]="frm.invalid">Show</button>
        </div>
      </div>

    </form>

    <div *ngIf="warningMessage !== ''">
      <mat-label style="color:red" [innerHTML]="warningMessage"></mat-label>
    </div>

    <br />
    <iframe *ngIf="urlSafe" class="report-wrapper fixed-height" [src]="urlSafe"></iframe>

  </mat-card-content>
</mat-card>
