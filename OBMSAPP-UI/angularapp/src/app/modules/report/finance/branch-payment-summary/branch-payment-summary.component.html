<div class="wlt-c-furg-content-header">
  <div class="container-fluid">
    <div class="row mb-3">
      <div class="col-12 col-sm-12 col-md-8 col-lg-5">
        <h1 class="mb-1">Report / Finance / Branch Payment Summary</h1>
      </div>
      <div class="col-12 col-sm-12 col-md-8 col-lg-7 my-1">
        <ol class="breadcrumb float-md-right">
          <li class="breadcrumb-item"><a routerLink="/dashboard">Report</a></li>
          <li class="breadcrumb-item active">Branch Payment Summary</li>
        </ol>
      </div>
    </div>
  </div>
</div>

<mat-card class="report-card">
  <mat-card-content>

    <form [formGroup]="frm" (ngSubmit)="onSubmit()">

      <div class="row" *ngIf="warningMessage === ''">
        <div class="payment-period-container" style="display: flex; align-items: center; gap: 8px;">
          <label style="font-weight: bold; white-space: nowrap; margin: 0px 5px 17px 13px;">Payment Period:</label>
          <mat-form-field appearance="outline" style="flex: 1; max-width: 200px;">
            <mat-label>Start Date</mat-label>
            <input type="text" formControlName="StartDate" matInput [matDatepicker]="picker1"
              placeholder="" autocomplete="off">
            <mat-datepicker-toggle matSuffix [for]="picker1"></mat-datepicker-toggle>
            <mat-datepicker #picker1></mat-datepicker>
          </mat-form-field>
          <span style="margin: 0 5px 17px 0;">to</span>
          <mat-form-field appearance="outline" style="flex: 1; max-width: 200px;">
            <mat-label>End Date</mat-label>
            <input type="text" formControlName="EndDate" matInput [matDatepicker]="picker2"
              placeholder="" autocomplete="off">
            <mat-datepicker-toggle matSuffix [for]="picker2"></mat-datepicker-toggle>
            <mat-datepicker #picker2></mat-datepicker>
          </mat-form-field>
          <mat-form-field appearance="outline" style="flex: 1; max-width: 220px;">
            <mat-label>Bank Name</mat-label>
            <mat-select formControlName="BankId">
              <mat-option value="">All Banks</mat-option>
              <mat-option *ngFor="let bank of bankList" [value]="bank.BankId">
                {{ bank.Accname }} ({{ bank.AccShortName }})
              </mat-option>
            </mat-select>
          </mat-form-field>
        </div>
      </div>

      <div class="row" *ngIf="warningMessage === ''">
        <div class="col-12 col-sm-12 col-md-4 col-lg-4 text-left" style="padding-top: 8px;">
          <button type="submit" class="btn wlt-c-furg-btn-primary m-1"> Show</button>
        </div>
      </div>

    </form>

    <br />
    <div *ngIf="warningMessage !== ''">
      <mat-label style="color:red" [innerHTML]="warningMessage"></mat-label>
    </div>
    <div *ngIf="errorMessage !== ''">
      <mat-label style="color:red" [innerHTML]="errorMessage"></mat-label>
    </div>
    <br />
    <iframe *ngIf="urlSafe" class="report-wrapper fixed-height" [src]="urlSafe"></iframe>

  </mat-card-content>
</mat-card>

<!-- Loading spinner -->
<div [style.display]="showLoadingSpinner ? 'block' : 'none'"
  style="margin-top: -10.5rem; display: block; margin-left: -6.5rem;">
  <div class="d-flex justify-content-center">
    <span class="loader"></span>
  </div>
</div>
