<div class="wlt-c-furg-content-header">
    <div class="container-fluid">
        <div class="row mb-2">
            <div class="col-12 col-sm-12 col-md-4 col-lg-4">
                <h1 class="mb-1">Report/Bank Salary Statement Report</h1>
            </div>
            <div class="col-12 col-sm-12 col-md-8 col-lg-8 my-1">
                <ol class="breadcrumb float-md-right">
                    <li class="breadcrumb-item"><a routerLink="/dashboard">Report</a></li>
                    <li class="breadcrumb-item active">Bank Salary Statement Report</li>
                </ol>
            </div>
        </div>
    </div>
</div>

<mat-card class="report-card">
    <mat-card-content>

        <form [formGroup]="frm" (ngSubmit)="onSubmit()">
            <div class="row" *ngIf="warningMessage ===''">
                <div class="col-12 col-sm-12 col-md-4 col-lg-4">
                    <mat-form-field appearance="outline">
                        <mat-label>Salary Period</mat-label>
                        <input type="text" formControlName="Period" matInput [matDatepicker]="picker1" placeholder=""
                            autocomplete="off" (dateChange)="changeAdvanceDate('change', $event)">
                        <mat-datepicker-toggle matSuffix [for]="picker1">
                        </mat-datepicker-toggle>
                        <mat-datepicker #picker1></mat-datepicker>
                    </mat-form-field>
                </div>
                <div class="col-12 col-sm-12 col-md-4 col-lg-4">
                    <mat-form-field appearance="outline">
                        <mat-label>Branch</mat-label>
                        <mat-select formControlName="Branch"
                            (keydown)="onKeyDropdown($event, 'branchSearchString', 'branchList', 'filteredBranchList', 'Code', branchSearchSubject)"
                            [panelClass]="'custom-dropdown-panel'" (selectionChange)="onBranchSelectionChange($event)">
                            <mat-option [value]="0" class="highlight-option"></mat-option>
                            <mat-option *ngFor="let d of branchList" value="{{d.Code}}">{{d.Code}}</mat-option>
                        </mat-select>
                    </mat-form-field>
                </div>
            </div>
            <div class="row" *ngIf="warningMessage ===''">
                <div class="col-12 col-sm-12 col-md-4 col-lg-3">
                    <mat-label class="mr-3"><strong>Employee Type</strong></mat-label>
                    <br />
                    <mat-radio-group aria-label="Select a Type" formControlName="EmployeeType">
                        <mat-radio-button value="Guard">Guard</mat-radio-button>
                        <mat-radio-button value="Staff">Staff</mat-radio-button>
                        <mat-radio-button value="Foreign Guard">Foreign Guard</mat-radio-button>
                        <mat-radio-button value="Others">Other Guards</mat-radio-button>
                    </mat-radio-group>
                </div>
                <div class="col-12 col-sm-12 col-md-4 col-lg-2">
                    <button class="btn wlt-c-furg-btn-primary m-1" (click)="generateExcelFileClick()">Generate Excel
                        File</button>
                </div>
                <div class="col-12 col-sm-12 col-md-4 col-lg-8">
                    <mat-label class="mr-3"></mat-label>
                    <br />
                    <mat-radio-group aria-label="Select a Type" formControlName="EmpTempType">
                        <mat-radio-button value="8">ALL</mat-radio-button>
                        <mat-radio-button value="4">Temporary Employee</mat-radio-button>
                        <mat-radio-button value="7">Permanent Employee</mat-radio-button>
                        <mat-radio-button value="Others">Other Guards</mat-radio-button>
                    </mat-radio-group>
                </div>
            </div>
            <div class="row">
                <div class="col-12 col-sm-12 col-md-4 col-lg-2">
                    <mat-label class="mr-3"><strong>Payment Type</strong></mat-label>
                </div>
                <div class="col-12 col-sm-12 col-md-4 col-lg-4" style="margin-left: -80px;">
                    <mat-radio-group aria-label="Split Salary Payment" formControlName="PaymentType">
                        <mat-radio-button value="Salary">Salary</mat-radio-button>
                        <mat-radio-button value="SalaryAdvance">Salary Advance</mat-radio-button>
                        <mat-radio-button value="Others">Other Guards</mat-radio-button>
                    </mat-radio-group>
                </div>
            </div>
            <div class="row" *ngIf="warningMessage ===''">
                <div class="col-12 col-sm-12 col-md-4 col-lg-3">
                    <mat-form-field appearance="outline">
                        <mat-label>Bank</mat-label>
                        <mat-select formControlName="BankCode"
                            (keydown)="onKeyDropdown($event, 'bankSearchString', 'bankList', 'filteredBankList', 'BankName', bankSearchSubject)"
                            [panelClass]="'custom-dropdown-panel'">
                            <mat-option [value]="0" class="highlight-option"></mat-option>
                            <mat-option *ngFor="let bank of bankList" [value]="bank.BankCode">
                                {{ bank.BankName }}
                            </mat-option>
                        </mat-select>
                    </mat-form-field>
                </div>
                <div class="col-12 col-sm-12 col-md-4 col-lg-9">
                    <div class="btn-group" role="group">
                        <button class="btn wlt-c-furg-btn-primary m-1" (click)="clkBtn(1)"> Show</button>
                        <button class="btn wlt-c-furg-btn-primary m-1" (click)="clkBtn(2)" hidden> Show Guard1</button>
                        <button class="btn wlt-c-furg-btn-primary m-1" (click)="clkBtn(3)" hidden> Show Guard2</button>
                        <button class="btn wlt-c-furg-btn-primary m-1" (click)="clkBtn(4)"> Generate File</button>
                        <button class="btn wlt-c-furg-btn-primary m-1" (click)="clkBtn(5)"> Generate File(Guard
                            1)</button>
                        <button class="btn wlt-c-furg-btn-primary m-1" (click)="clkBtn(6)"> Generate File(Guard
                            2)</button>
                    </div>
                </div>
            </div>
        </form>
        <br />
        <div *ngIf="warningMessage !==''">
            <mat-label style="color:red" [innerHTML]="warningMessage"></mat-label>
        </div>
        <div *ngIf="errorMessage !==''">
            <mat-label style="color:red" [innerHTML]="errorMessage"></mat-label>
        </div>
        <iframe *ngIf="urlSafe" class="report-wrapper fixed-height" [src]="urlSafe"></iframe>
    </mat-card-content>
</mat-card>

<!-- model pop up for logic started -->
<div [style.display]="showLoadingSpinner ? 'block' : 'none'"
    style="margin-top: -10.5rem; display: block; margin-left: -6.5rem;">
    <div class="d-flex justify-content-center">
        <span class="loader"></span>
    </div>
</div>
<!-- model pop up for logic ended -->
