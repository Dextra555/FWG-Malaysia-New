<div class="wlt-c-furg-content-header">
    <div class="container-fluid">
        <div class="row mb-2">
            <div class="col-12 col-sm-12 col-md-4 col-lg-4">
                <h1 class="md-1">Monthly Advance Report</h1>
            </div>
            <div class="col-12 col-sm-12 col-md-8 col-lg-8 my-1">
                <ol class="breadcrumb float-md-right">
                    <li class="breadcrumb-item"><a routerLink="/dashboard">Report</a></li>
                    <li class="breadcrumb-item">Monthly Advance Report
                    </li>
                </ol>
            </div>
        </div>
    </div>
</div>
<mat-card class="report-card">
    <mat-card-content>
        <form [formGroup]="monthlyAdvanceForm">
            <div class="row" *ngIf="warningMessage ===''">
                <div class="col-12 col-sm-12 col-md-12 col-lg-2">
                    <mat-form-field appearance="outline">
                        <mat-label>Advance Date</mat-label>
                        <div style="display: flex; align-items: center;">
                            <input matInput [matDatepicker]="picker" formControlName="AdvanceDate"
                                (dateChange)="changeAdvanceDate('change', $event)">
                            <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
                        </div>
                        <mat-hint>MM/DD/YYYY</mat-hint>
                        <mat-datepicker #picker></mat-datepicker>
                    </mat-form-field>
                </div>
                <div class="col-12 col-sm-12 col-md-12 col-lg-4">
                    <mat-form-field appearance="outline">
                        <mat-label>Branch Code</mat-label>
                        <mat-select formControlName="BranchCode"
                            (keydown)="onKeyDropdown($event, 'branchSearchString', 'branchModel', 'filteredBranchList', 'Code', branchSearchSubject)"
                            [panelClass]="'custom-dropdown-panel'">
                            <mat-option [value]="" class="highlight-option"></mat-option>
                            <mat-option *ngFor="let branch of branchModel" [value]="branch.Code">
                                {{ branch.Code }}
                            </mat-option>
                        </mat-select>
                    </mat-form-field>
                </div>
                <div class="col-12 col-sm-12 col-md-12 col-lg-4" *ngIf="errorMessage !==''">
                    <mat-label style="color:red">{{errorMessage}}</mat-label>
                </div>
            </div>
            <div class="col-12 col-sm-12 col-md-12 col-lg-12" *ngIf="warningMessage ===''">
                <div class="row">
                    <div class="col-12 col-sm-12 col-md-4 col-lg-8">
                        <mat-label class="mr-3"><strong>Employee Type</strong></mat-label>
                        <br />
                        <mat-radio-group aria-label="Select a Type" formControlName="EmployeeType">
                            <mat-radio-button value="Guard">Guard</mat-radio-button>
                            <mat-radio-button value="Staff">Staff</mat-radio-button>
                        <mat-radio-button value="Others">Other Guards</mat-radio-button>
                        </mat-radio-group>
                    </div>
                </div>
            </div>
            <div class="col-12 col-sm-12 col-md-12 col-lg-12" *ngIf="warningMessage ===''">
                <div class="row">
                    <div class="col-12 col-sm-12 col-md-4 col-lg-8">
                        <mat-label class="mr-3"><strong>Advance Type</strong></mat-label>
                        <br />
                        <mat-radio-group aria-label="Select a Type" formControlName="AdvanceType"
                            (change)="radioButtonTypeSelectionChange($event)">
                            <mat-radio-button value="Daily">Daily</mat-radio-button>
                            <mat-radio-button value="Monthly">Monthly</mat-radio-button>
                        <mat-radio-button value="Others">Other Guards</mat-radio-button>
                        </mat-radio-group>
                    </div>
                </div>
            </div>
            <div class="col-12 col-sm-12 col-md-12 col-lg-12" *ngIf="warningMessage ===''">
                <div class="row">
                    <div class="col-12 col-sm-12 col-md-4 col-lg-4">
                        <mat-label class="mr-3"><strong>Payment Mode</strong></mat-label>
                        <br />
                        <mat-radio-group aria-label="Select a Race" formControlName="PaymentType"
                            [disabled]="monthlyAdvanceForm.get('AdvanceType')?.value === 'Daily'">
                            <mat-radio-button value="Bank">Bank</mat-radio-button>
                            <mat-radio-button value="Cash">Cash</mat-radio-button>
                            <mat-radio-button value="Cheque">Cheque</mat-radio-button>
                            <mat-radio-button value="All">All</mat-radio-button>
                        <mat-radio-button value="Others">Other Guards</mat-radio-button>
                        </mat-radio-group>
                    </div>
                    <div class="col-12 col-sm-12 col-md-4 col-lg-2">
                        <div class="text-right">
                            <button class="btn wlt-c-furg-btn-primary" [disabled]="monthlyAdvanceForm.invalid"
                                (click)="savebuttonClick()">Show </button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row"
                *ngIf="monthlyAdvanceForm.get('AdvanceType')?.value === 'Monthly' && monthlyAdvanceForm.get('PaymentType')?.value === 'Bank'">
                <div class="col-12 col-sm-12 col-md-4 col-lg-4">
                    <mat-form-field appearance="outline">
                        <mat-label>Bank</mat-label>
                        <mat-select formControlName="BankCode"
                            (keydown)="onKeyDropdown($event, 'bankSearchString', 'bankList', 'filteredBankList', 'BankName', bankSearchSubject)"
                            [panelClass]="'custom-dropdown-panel'">
                            <mat-option [value]="" class="highlight-option"></mat-option>
                            <mat-option *ngFor="let bank of bankList" [value]="bank.BankCode">
                                {{ bank.BankName }}
                            </mat-option>
                        </mat-select>
                    </mat-form-field>
                </div>
            </div>
        </form>
        <br />
        <div *ngIf="warningMessage !==''">
            <mat-label style="color:red" [innerHTML]="warningMessage"></mat-label>
        </div>
        <div *ngIf="errorMessage !==''">
            <mat-label style="color:red" [innerHTML]="errorMessage"></mat-label>
        </div>
        <iframe *ngIf="urlSafe" class="report-wrapper fixed-height" [src]="urlSafe"></iframe>
    </mat-card-content>
</mat-card>

<!-- model pop up for logic started -->
<div [style.display]="showLoadingSpinner ? 'block' : 'none'"
    style="margin-top: -10.5rem; display: block; margin-left: -6.5rem;">
    <div class="d-flex justify-content-center">
        <span class="loader"></span>
    </div>
</div>
<!-- model pop up for logic ended -->
