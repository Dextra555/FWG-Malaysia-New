<div class="wlt-c-furg-content-header">
    <div class="container-fluid">
        <div class="row mb-2">
            <div class="col-12 col-sm-12 col-md-4 col-lg-4">
                <h1 class="mb-1">Report/List Summary Report</h1>
            </div>
            <div class="col-12 col-sm-12 col-md-8 col-lg-8 my-1">
                <ol class="breadcrumb float-md-right">
                     <li class="breadcrumb-item"><a routerLink="/dashboard">Report</a></li>
                    <li class="breadcrumb-item active">List Summary Report</li>
                </ol>
            </div>
        </div>
    </div>
</div>

<mat-card class="report-card full-width-report">
    <mat-card-content>

        <form [formGroup]="frm" (ngSubmit)="onSubmit()">
            <div class="row" *ngIf="warningMessage ===''">
                <div class="col-12 col-sm-12 col-md-4 col-lg-3">
                    <mat-form-field appearance="outline">
                        <mat-label>Period</mat-label>
                        <input type="text" formControlName="Period" matInput [matDatepicker]="picker1" placeholder=""
                            autocomplete="off" (dateChange)="changeAdvanceDate('change', $event)">
                        <mat-datepicker-toggle matSuffix [for]="picker1">
                        </mat-datepicker-toggle>
                        <mat-datepicker #picker1></mat-datepicker>
                    </mat-form-field>
                </div>               
            </div>
            <div class="row" *ngIf="warningMessage ===''">
                <div class="col-12 col-sm-12 col-md-4 col-lg-10">
                    <mat-label class="mr-3"><strong>Employee Type</strong></mat-label>
                    <br />
                    <mat-radio-group aria-label="Select a Type" formControlName="EmployeeType">
                        <mat-radio-button value="Guard">Guard</mat-radio-button>
                        <mat-radio-button value="Staff">Staff</mat-radio-button>
                        <mat-radio-button value="Others">Other Guards</mat-radio-button>
                    </mat-radio-group>
                </div>
                <div class="col-12 col-sm-12 col-md-4 col-lg-3">
                    <mat-label class="mr-3"><strong>Report Type</strong></mat-label>
                    <br />
                    <mat-radio-group aria-label="Select a Type" formControlName="ReportType">
                        <mat-radio-button value="1">Advance</mat-radio-button>
                        <mat-radio-button value="2">Salary</mat-radio-button>
                        <mat-radio-button value="Others">Other Guards</mat-radio-button>
                    </mat-radio-group>
                </div>
                <div class="col-12 col-sm-12 col-md-4 col-lg-9">
                    <div class="btn-group" role="group">
                        <button class="btn wlt-c-furg-btn-primary m-1" (click)="clkBtn()"> Show</button>
                    </div>
                </div>
            </div>
        </form>
        <br />
        <div *ngIf="warningMessage !==''">
            <mat-label style="color:red" [innerHTML]="warningMessage"></mat-label>
        </div>
        <div *ngIf="errorMessage !==''">
            <mat-label style="color:red" [innerHTML]="errorMessage"></mat-label>
        </div>
        <iframe *ngIf="urlSafe" class="report-wrapper fixed-height" [src]="urlSafe"></iframe>
    </mat-card-content>
</mat-card>

<!-- model pop up for logic started -->
<div [style.display]="showLoadingSpinner ? 'block' : 'none'"
    style="margin-top: -10.5rem; display: block; margin-left: -6.5rem;">
    <div class="d-flex justify-content-center">
        <span class="loader"></span>
    </div>
</div>
